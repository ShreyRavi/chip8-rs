<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0a0a0f"/>
  <!-- Chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="#1a2a4a" stroke="#4080c0" stroke-width="1.2"/>
  <!-- Pins left -->
  <rect x="4" y="11" width="4" height="2" rx="0.5" fill="#4080c0"/>
  <rect x="4" y="15" width="4" height="2" rx="0.5" fill="#4080c0"/>
  <rect x="4" y="19" width="4" height="2" rx="0.5" fill="#4080c0"/>
  <!-- Pins right -->
  <rect x="24" y="11" width="4" height="2" rx="0.5" fill="#4080c0"/>
  <rect x="24" y="15" width="4" height="2" rx="0.5" fill="#4080c0"/>
  <rect x="24" y="19" width="4" height="2" rx="0.5" fill="#4080c0"/>
  <!-- Pins top -->
  <rect x="11" y="4" width="2" height="4" rx="0.5" fill="#4080c0"/>
  <rect x="15" y="4" width="2" height="4" rx="0.5" fill="#4080c0"/>
  <rect x="19" y="4" width="2" height="4" rx="0.5" fill="#4080c0"/>
  <!-- Pins bottom -->
  <rect x="11" y="24" width="2" height="4" rx="0.5" fill="#4080c0"/>
  <rect x="15" y="24" width="2" height="4" rx="0.5" fill="#4080c0"/>
  <rect x="19" y="24" width="2" height="4" rx="0.5" fill="#4080c0"/>
  <!-- C8 label -->
  <text x="16" y="18.5" text-anchor="middle" font-family="monospace" font-size="6.5" font-weight="bold" fill="#a0c4ff">C8</text>
</svg>
